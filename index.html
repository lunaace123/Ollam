<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MistMC Admin - Unified Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0e0e0e;
      color: #fff;
      font-family: 'Inter', sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .glass-card {
      background: rgba(20,20,20,0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .status-pending {
      color: #f59e0b;
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.2);
    }
    .status-approved {
      color: #10b981;
      background: rgba(16,185,129,0.1);
      border: 1px solid rgba(16,185,129,0.2);
    }
    .status-rejected {
      color: #ef4444;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.2);
    }
    .btn-red {
      background: #ff4d4d;
      color: #fff;
      font-weight: 700;
      transition: all 0.2s;
    }
    .btn-red:hover {
      background: #ff3333;
      transform: translateY(-1px);
    }
    .option-row {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .winner-badge {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      box-shadow: 0 0 15px rgba(245,158,11,0.3);
    }
    .tab-active {
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border-color: rgba(255, 77, 77, 0.4);
    }
    .tab-inactive {
      background: rgba(255,255,255,0.03);
      color: #9ca3af;
      border-color: rgba(255,255,255,0.08);
    }
    .tab-inactive:hover {
      background: rgba(255,255,255,0.07);
      color: #e5e7eb;
    }
    /* Custom scroll for voters list */
    .voters-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .voters-scroll::-webkit-scrollbar-track {
      background: #1f1f1f;
      border-radius: 8px;
    }
    .voters-scroll::-webkit-scrollbar-thumb {
      background: #ff4d4d;
      border-radius: 8px;
    }
  </style>
  <!-- disable right click & devtools shortcuts (simple protection) -->
  <script>
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C'))) {
        e.preventDefault();
      }
    });
  </script>
</head>
<body class="p-4 md:p-8">

<div class="max-w-7xl mx-auto">
  <!-- Unified Header -->
  <header class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
    <div class="flex items-center gap-4">
      <img src="https://i.ibb.co/Y7kd673X/6bdb793d-aa0a-4616-ae6b-42f4c7cafe46.png" alt="MistMC Logo" class="w-12 h-12 object-contain" />
      <div>
        <h1 class="text-3xl font-black text-white font-['Montserrat'] tracking-tight">ADMIN DASHBOARD</h1>
        <p class="text-gray-500 text-sm">Orders & Polls Control Center</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span class="bg-red-500/10 text-red-500 px-3 py-1 rounded-lg border border-red-500/20 text-[10px] font-bold uppercase tracking-widest">Secure Access</span>
    </div>
  </header>

  <!-- Tab Navigation -->
  <div class="flex gap-3 mb-8 border-b border-white/10 pb-3">
    <button id="tab-orders-btn" class="tab-active flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold uppercase tracking-wide transition-all border">
      <i data-lucide="shopping-cart" class="w-4 h-4"></i> Order Management
    </button>
    <button id="tab-polls-btn" class="tab-inactive flex items-center gap-2 px-5 py-2.5 rounded-xl text-sm font-bold uppercase tracking-wide transition-all border">
      <i data-lucide="vote" class="w-4 h-4"></i> Poll Management
    </button>
  </div>

  <!-- ORDERS SECTION (tab content) -->
  <div id="orders-section" class="transition-all duration-300">
    <div class="max-w-6xl">
      <div id="requests-list">
        <div class="text-center py-20 text-gray-600">Loading payment requests...</div>
      </div>
    </div>
  </div>

  <!-- POLLS SECTION (hidden initially) -->
  <div id="polls-section" class="hidden transition-all duration-300">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Create Poll Form -->
      <div class="lg:col-span-1">
        <div class="glass-card rounded-2xl p-6 sticky top-8">
          <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
            <i data-lucide="plus-circle" class="text-red-500"></i> Create New Poll
          </h2>
          <div class="space-y-4">
            <div>
              <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Poll Title</label>
              <input type="text" id="poll-title" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-red-500/50 outline-none transition-all" placeholder="Should we add Lifesteal?">
            </div>
            <div>
              <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Image URL</label>
              <input type="text" id="poll-image" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-red-500/50 outline-none transition-all" placeholder="https://i.ibb.co/...">
            </div>
            <div>
              <label class="text-[10px] uppercase font-bold text-gray-500 mb-2 block">Voting Options</label>
              <div id="options-container" class="space-y-2 mb-3"></div>
              <button onclick="window.addOptionField()" type="button" class="text-[10px] text-red-400 hover:text-red-300 font-bold uppercase tracking-widest flex items-center gap-1">
                <i data-lucide="plus" class="w-3 h-3"></i> Add Option
              </button>
            </div>
            <div>
              <label class="text-[10px] uppercase font-bold text-gray-500 mb-1 block">Description / Content</label>
              <textarea id="poll-content" rows="4" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:border-red-500/50 outline-none transition-all resize-none" placeholder="Give more details about the poll..."></textarea>
            </div>
            <button onclick="window.createPoll()" class="btn-red w-full py-4 rounded-xl font-bold uppercase tracking-widest text-xs flex items-center justify-center gap-2">
              <i data-lucide="send" class="w-4 h-4"></i> Create Poll
            </button>
          </div>
        </div>
      </div>

      <!-- Polls List -->
      <div class="lg:col-span-2 space-y-6" id="polls-list">
        <div class="text-center py-20 text-gray-600">Loading polls...</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, set, remove, push } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

  // Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyAHrBE3doAhDni4mcNhylJD8o3r5cNZYSI",
    authDomain: "ls-mannage.firebaseapp.com",
    databaseURL: "https://ls-mannage-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ls-mannage",
    storageBucket: "ls-mannage.firebasestorage.app",
    messagingSenderId: "115534926798",
    appId: "1:115534926798:web:4ea3ab3c1a2d44e2e1d19f",
    measurementId: "G-P2JQH8M41Y"
  };
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ------------------- GLOBAL FUNCTIONS (ORDERS) -------------------
  window.updateStatus = async (uid, orderId, status) => {
    try {
      const updates = {};
      updates[`requests/${orderId}/status`] = status;
      updates[`orders/${uid}/${orderId}/status`] = status;
      await update(ref(db), updates);
      alert(`Order ${status}!`);
    } catch (error) {
      console.error(error);
      alert("Failed to update status");
    }
  };

  window.deleteRequest = async (uid, orderId) => {
    if (!confirm("Are you sure you want to delete this request permanently?")) return;
    try {
      const updates = {};
      updates[`requests/${orderId}`] = null;
      if (uid && uid !== 'undefined' && uid !== 'null') {
        updates[`orders/${uid}/${orderId}`] = null;
      }
      await update(ref(db), updates);
      alert("Request deleted successfully!");
    } catch (error) {
      console.error("Delete failed:", error);
      alert("Failed to delete: " + error.message);
    }
  };

  // Load Orders with realtime listener
  function loadOrders() {
    const requestsRef = ref(db, 'requests');
    onValue(requestsRef, (snapshot) => {
      const data = snapshot.val();
      const list = document.getElementById('requests-list');
      if (!data) {
        list.innerHTML = '<div class="text-center py-20 text-gray-600">No payment requests yet.</div>';
        return;
      }
      const requests = Object.entries(data).reverse();
      list.innerHTML = requests.map(([id, req]) => `
        <div class="glass-card rounded-2xl p-6 flex flex-col md:flex-row justify-between gap-6">
          <div class="space-y-4 flex-1">
            <div class="flex items-center gap-3">
              <span class="px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider status-${req.status}">
                ${req.status}
              </span>
              <span class="text-xs text-gray-600 font-mono">#${id}</span>
              <span class="text-xs text-gray-600">${new Date(req.timestamp).toLocaleString()}</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div>
                <p class="text-[10px] uppercase font-bold text-gray-500 mb-1">User Info</p>
                <p class="text-sm font-semibold text-white">${escapeHtml(req.userName)}</p>
                <p class="text-xs text-gray-400">${escapeHtml(req.userEmail)}</p>
              </div>
              <div>
                <p class="text-[10px] uppercase font-bold text-gray-500 mb-1">Minecraft Details</p>
                <p class="text-sm font-semibold text-emerald-400">IGN: ${escapeHtml(req.ingameName)}</p>
                <p class="text-xs text-gray-400">DC: ${escapeHtml(req.discordId)}</p>
              </div>
              <div>
                <p class="text-[10px] uppercase font-bold text-gray-500 mb-1">Payment Info</p>
                <p class="text-sm font-semibold text-amber-400">UPI: ${escapeHtml(req.upiId)}</p>
                <p class="text-xs text-gray-400">Amount: ₹${req.total.toFixed(2)}</p>
              </div>
            </div>
            <div class="pt-2">
               <p class="text-[10px] uppercase font-bold text-gray-500 mb-2">Items Purchased</p>
               <div class="flex flex-wrap gap-2">
                 ${req.items.map(i => `<span class="bg-white/5 border border-white/10 px-2 py-1 rounded text-xs text-gray-300">${i.qty}x ${escapeHtml(i.name)}</span>`).join('')}
               </div>
            </div>
          </div>
          <div class="flex md:flex-col justify-end gap-2 border-t md:border-t-0 md:border-l border-white/5 pt-4 md:pt-0 md:pl-6">
            <button onclick="updateStatus('${req.uid}', '${id}', 'approved')" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-500 hover:text-white px-6 py-2 rounded-xl text-sm font-bold border border-emerald-600/30 transition-all flex items-center justify-center gap-2">
              <i data-lucide="check" class="w-4 h-4"></i> Approve
            </button>
            <button onclick="updateStatus('${req.uid}', '${id}', 'rejected')" class="bg-red-600/20 hover:bg-red-700 text-red-500 hover:text-white px-6 py-2 rounded-xl text-sm font-bold border border-red-600/30 transition-all flex items-center justify-center gap-2">
              <i data-lucide="x" class="w-4 h-4"></i> Reject
            </button>
            <button onclick="deleteRequest('${req.uid}', '${id}')" class="bg-white/5 hover:bg-white/10 text-gray-500 hover:text-white px-6 py-2 rounded-xl text-sm font-bold border border-white/10 transition-all flex items-center justify-center gap-2">
              <i data-lucide="trash-2" class="w-4 h-4"></i> Delete
            </button>
          </div>
        </div>
      `).join('');
      lucide.createIcons();
    });
  }

  // ------------------- POLLS LOGIC -------------------
  const colorOptions = [
    { name: 'Red', val: 'red' }, { name: 'Green', val: 'emerald' }, { name: 'Blue', val: 'blue' },
    { name: 'Orange', val: 'amber' }, { name: 'Purple', val: 'purple' }, { name: 'Pink', val: 'rose' }, { name: 'Gray', val: 'gray' }
  ];

  window.addOptionField = (text = '', color = 'blue') => {
    const container = document.getElementById('options-container');
    if (!container) return;
    const div = document.createElement('div');
    div.className = 'option-row flex gap-2 p-2 rounded-xl items-center';
    div.innerHTML = `
      <input type="text" class="opt-text flex-1 bg-transparent border-none outline-none text-xs" placeholder="Option text" value="${escapeHtml(text)}">
      <select class="opt-color bg-white/5 border border-white/10 rounded-lg text-[10px] px-2 py-1 outline-none">
        ${colorOptions.map(c => `<option value="${c.val}" ${c.val === color ? 'selected' : ''}>${c.name}</option>`).join('')}
      </select>
      <button onclick="this.parentElement.remove()" class="text-gray-600 hover:text-red-500 transition-colors">
        <i data-lucide="x" class="w-3 h-3"></i>
      </button>
    `;
    container.appendChild(div);
    lucide.createIcons();
  };

  window.createPoll = async () => {
    const title = document.getElementById('poll-title')?.value.trim();
    const image = document.getElementById('poll-image')?.value.trim();
    const content = document.getElementById('poll-content')?.value.trim();
    const optionRows = document.querySelectorAll('#options-container .option-row');
    const options = Array.from(optionRows).map(row => ({
      text: row.querySelector('.opt-text')?.value.trim() || '',
      color: row.querySelector('.opt-color')?.value || 'blue'
    })).filter(o => o.text);
    if (!title || !content || options.length === 0) {
      alert("Please fill in title, content and at least one option");
      return;
    }
    const newPollRef = push(ref(db, 'polls'));
    await set(newPollRef, {
      title,
      image: image || 'https://i.ibb.co/G4xnSPpD/hero-banner.jpg',
      content,
      options,
      timestamp: Date.now(),
      status: 'active'
    });
    // Reset form
    const titleInput = document.getElementById('poll-title');
    const imageInput = document.getElementById('poll-image');
    const contentInput = document.getElementById('poll-content');
    if (titleInput) titleInput.value = '';
    if (imageInput) imageInput.value = '';
    if (contentInput) contentInput.value = '';
    const optionsContainer = document.getElementById('options-container');
    if (optionsContainer) optionsContainer.innerHTML = '';
    window.addOptionField('Yes', 'emerald');
    window.addOptionField('No', 'red');
    alert("Poll created!");
  };

  window.deletePoll = async (id) => {
    if (!confirm("Are you sure? This will delete the poll and all votes.")) return;
    await remove(ref(db, `polls/${id}`));
    await remove(ref(db, `votes/${id}`));
    alert("Poll deleted");
  };

  window.setWinner = async (pollId, optionText) => {
    if (!confirm(`Mark "${optionText}" as the winner? This will close the poll.`)) return;
    await update(ref(db, `polls/${pollId}`), {
      winner: optionText,
      status: 'completed'
    });
    alert("Winner set! Poll is now closed.");
  };

  window.toggleVoters = (id) => {
    const el = document.getElementById(`voters-${id}`);
    if (el) el.classList.toggle('hidden');
  };

  function loadPolls() {
    const pollsRef = ref(db, 'polls');
    const votesRef = ref(db, 'votes');
    onValue(pollsRef, (snapshot) => {
      const pollsData = snapshot.val();
      const list = document.getElementById('polls-list');
      if (!pollsData) {
        if (list) list.innerHTML = '<div class="text-center py-20 text-gray-600">No polls created yet.</div>';
        return;
      }
      onValue(votesRef, (voteSnap) => {
        const votesData = voteSnap.val() || {};
        const polls = Object.entries(pollsData).reverse();
        if (!list) return;
        list.innerHTML = polls.map(([id, poll]) => {
          const pollVotes = votesData[id] || {};
          const voteEntries = Object.values(pollVotes);
          const total = voteEntries.length;
          const pollOptions = poll.options || [{text: 'Yes', color: 'emerald'}, {text: 'No', color: 'red'}];
          const resultsHtml = pollOptions.map(opt => {
            const optText = typeof opt === 'object' ? opt.text : opt;
            const optColor = typeof opt === 'object' ? opt.color : (optText.toLowerCase() === 'yes' ? 'emerald' : 'red');
            const count = voteEntries.filter(v => v.option && v.option.toLowerCase() === optText.toLowerCase()).length;
            const percent = total > 0 ? Math.round((count / total) * 100) : 0;
            const isWinner = poll.winner === optText;
            return `
              <div class="relative group">
                <div class="flex justify-between text-xs font-bold mb-1">
                  <div class="flex items-center gap-2">
                    <span class="text-${optColor}-400">${escapeHtml(optText).toUpperCase()} (${count})</span>
                    ${isWinner ? '<span class="bg-amber-500 text-[8px] text-white px-1.5 py-0.5 rounded uppercase">Winner</span>' : ''}
                  </div>
                  <span class="text-gray-500">${percent}%</span>
                </div>
                <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                  <div class="bg-${optColor}-500 h-full transition-all duration-500" style="width: ${percent}%"></div>
                </div>
                ${!poll.winner ? `
                  <button onclick="setWinner('${id}', '${escapeHtml(optText).replace(/'/g, "\\'")}')" class="absolute -right-2 top-0 opacity-0 group-hover:opacity-100 bg-white/10 hover:bg-white/20 text-[8px] px-2 py-1 rounded transition-all">
                    Set Winner
                  </button>
                ` : ''}
              </div>
            `;
          }).join('');
          const votersHtml = voteEntries.length > 0 ? voteEntries.map(v => `
            <div class="flex justify-between items-center text-xs p-2 bg-white/5 rounded-lg border border-white/5">
              <span class="text-gray-300">${escapeHtml(v.userEmail)}</span>
              <span class="font-bold uppercase text-blue-400">${escapeHtml(v.option)}</span>
            </div>
          `).join('') : '<p class="text-gray-600 text-xs italic">No votes yet</p>';
          return `
            <div class="glass-card rounded-2xl overflow-hidden ${poll.winner ? 'ring-1 ring-amber-500/30' : ''}">
              <div class="flex flex-col md:flex-row">
                <div class="md:w-48 h-48 md:h-auto shrink-0 relative">
                  <img src="${poll.image}" class="w-full h-full object-cover" onerror="this.src='https://i.ibb.co/G4xnSPpD/hero-banner.jpg'">
                  ${poll.winner ? `
                    <div class="absolute inset-0 bg-amber-500/20 flex items-center justify-center backdrop-blur-[2px]">
                       <div class="winner-badge px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-[0.2em]">Closed</div>
                    </div>
                  ` : ''}
                </div>
                <div class="p-6 flex-1 flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start mb-2">
                      <div class="flex items-center gap-3">
                        <h3 class="text-xl font-bold">${escapeHtml(poll.title)}</h3>
                        ${poll.status === 'completed' ? '<span class="text-[10px] bg-white/5 text-gray-500 px-2 py-0.5 rounded border border-white/10 uppercase font-bold">Ended</span>' : ''}
                      </div>
                      <button onclick="deletePoll('${id}')" class="text-gray-500 hover:text-red-500 transition-colors">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                      </button>
                    </div>
                    <p class="text-gray-400 text-sm mb-6">${escapeHtml(poll.content)}</p>
                    <div class="space-y-6">
                      ${resultsHtml}
                    </div>
                  </div>
                  <div class="mt-6 pt-4 border-t border-white/5 flex justify-between items-center">
                    <span class="text-[10px] text-gray-500 uppercase tracking-widest font-bold">Total Votes: ${total}</span>
                    <button onclick="toggleVoters('${id}')" class="text-[10px] text-red-400 hover:text-red-300 uppercase tracking-widest font-bold">View Voter Details</button>
                  </div>
                </div>
              </div>
              <div id="voters-${id}" class="hidden p-6 bg-black/40 border-t border-white/5">
                <h4 class="text-xs font-bold uppercase tracking-widest mb-4">Voter Log</h4>
                <div class="max-h-40 overflow-y-auto space-y-2 pr-2 voters-scroll">
                  ${votersHtml}
                </div>
              </div>
            </div>
          `;
        }).join('');
        lucide.createIcons();
      });
    });
  }

  // Helper: escape HTML to prevent injection
  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // ------------------- TAB SWITCHING -------------------
  const ordersSection = document.getElementById('orders-section');
  const pollsSection = document.getElementById('polls-section');
  const tabOrdersBtn = document.getElementById('tab-orders-btn');
  const tabPollsBtn = document.getElementById('tab-polls-btn');

  function setActiveTab(tab) {
    if (tab === 'orders') {
      ordersSection?.classList.remove('hidden');
      pollsSection?.classList.add('hidden');
      tabOrdersBtn?.classList.add('tab-active');
      tabOrdersBtn?.classList.remove('tab-inactive');
      tabPollsBtn?.classList.add('tab-inactive');
      tabPollsBtn?.classList.remove('tab-active');
      // refresh icons in orders if needed
      setTimeout(() => lucide.createIcons(), 50);
    } else {
      ordersSection?.classList.add('hidden');
      pollsSection?.classList.remove('hidden');
      tabPollsBtn?.classList.add('tab-active');
      tabPollsBtn?.classList.remove('tab-inactive');
      tabOrdersBtn?.classList.add('tab-inactive');
      tabOrdersBtn?.classList.remove('tab-active');
      setTimeout(() => lucide.createIcons(), 50);
    }
  }

  if (tabOrdersBtn) tabOrdersBtn.addEventListener('click', () => setActiveTab('orders'));
  if (tabPollsBtn) tabPollsBtn.addEventListener('click', () => setActiveTab('polls'));

  // Initialize default options for poll creation form
  function initPollForm() {
    const container = document.getElementById('options-container');
    if (container && container.children.length === 0) {
      window.addOptionField('Yes', 'emerald');
      window.addOptionField('No', 'red');
    }
  }

  // Start realtime listeners
  loadOrders();
