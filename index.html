<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Portal | Secure Nexus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ---------- ENTRANCE OVERLAY (first screen) ---------- */
        .entrance-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 10%, #0a0f1e, #03060c);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            transition: opacity 1.2s cubic-bezier(0.23, 1, 0.32, 1), visibility 0s 1.2s;
            backdrop-filter: blur(0px);
            font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Poppins', sans-serif;
        }

        .entrance-card {
            text-align: center;
            max-width: 520px;
            width: 90%;
            background: rgba(12, 20, 35, 0.7);
            backdrop-filter: blur(16px);
            border-radius: 64px;
            padding: 2.8rem 2rem;
            border: 1px solid rgba(72, 187, 255, 0.4);
            box-shadow: 0 30px 45px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(0, 255, 255, 0.1);
            transition: transform 0.4s ease;
        }

        .entrance-card h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #b5f0ff, #4d9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.75rem;
        }

        .entrance-sub {
            color: #a0bbd9;
            margin-bottom: 2rem;
            font-weight: 400;
            font-size: 1rem;
            border-bottom: 1px dashed #2e4a7a;
            display: inline-block;
            padding-bottom: 6px;
        }

        .enter-pulse {
            background: linear-gradient(95deg, #1d4ed8, #3b82f6);
            border: none;
            padding: 1rem 2.4rem;
            font-size: 1.6rem;
            font-weight: bold;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 20px -5px #1e3a8a80;
            transition: all 0.25s;
            font-family: monospace;
            letter-spacing: 1px;
            margin-top: 1rem;
            width: 80%;
        }

        .enter-pulse:hover {
            transform: scale(1.02);
            background: linear-gradient(95deg, #2563eb, #60a5fa);
            box-shadow: 0 20px 30px -8px #0f2b6d;
            cursor: pointer;
        }

        .enter-pulse:active {
            transform: scale(0.98);
        }

        .note {
            margin-top: 1.8rem;
            font-size: 0.75rem;
            color: #5a789b;
            font-family: monospace;
        }

        /* ---------- MAIN IFRAME / DASHBOARD CONTAINER ---------- */
        .dashboard-container {
            width: 100%;
            height: 100vh;
            background: #0b0e17;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.9s ease-in-out;
            position: relative;
        }

        .dashboard-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #f8fafc;
        }

        /* fallback loader while iframe loads (subtle) */
        .iframe-loader {
            position: absolute;
            bottom: 20px;
            right: 24px;
            background: #11161fcc;
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 40px;
            color: #9bbde2;
            font-size: 12px;
            font-family: monospace;
            z-index: 10;
            pointer-events: none;
            transition: 0.2s;
            border-left: 3px solid #3b82f6;
        }

        /* Responsive extras */
        @media (max-width: 550px) {
            .entrance-card h1 { font-size: 2.2rem; }
            .enter-pulse { font-size: 1.3rem; padding: 0.8rem 1rem; width: 90%;}
            .entrance-card { padding: 1.8rem 1rem; border-radius: 48px; }
        }

        /* make sure body takes full height, no scrollbars on entrance */
        body {
            margin: 0;
            background: #000;
            overflow-x: hidden;
        }

        .hidden-overlay {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- ENTRANCE SCREEN: user must "enter" to activate the change -->
    <div id="entranceScreen" class="entrance-overlay">
        <div class="entrance-card">
            <h1>✦ PORTAL ✦</h1>
            <div class="entrance-sub">restricted nexus · execute access</div>
            <button id="enterButton" class="enter-pulse">⏎ ENTER SITE ⏎</button>
            <div class="note">⚡ secure channel | will redirect to admin dashboard</div>
        </div>
    </div>

    <!-- MAIN TARGET: where the external dashboard (poopoopoooadmin.vercel.app) will be displayed -->
    <div id="dashboardArea" class="dashboard-container" style="opacity: 0;">
        <iframe id="targetIframe" title="Admin Panel" src="about:blank"></iframe>
        <div class="iframe-loader" id="loaderHint">⚡ establishing secure link...</div>
    </div>

    <script>
        (function() {
            // TARGET URL — exactly as specified
            const TARGET_URL = "https://poopoopoooadmin.vercel.app/";
            
            // DOM elements
            const entranceDiv = document.getElementById('entranceScreen');
            const dashboardContainer = document.getElementById('dashboardArea');
            const iframeElem = document.getElementById('targetIframe');
            const loaderHint = document.getElementById('loaderHint');
            
            // flag to avoid double trigger
            let transitionStarted = false;
            
            // Helper: perform the "site change" effect
            function activateDashboard() {
                if (transitionStarted) return;
                transitionStarted = true;
                
                // Start preloading iframe content (optional but user sees seamless)
                // set iframe src BEFORE animation finishes? we want smooth transition:
                // we set src now, but the iframe will load in background while entrance fades.
                iframeElem.src = TARGET_URL;
                
                // Show loading hint animation
                if (loaderHint) {
                    loaderHint.style.opacity = '1';
                    loaderHint.textContent = '🌀 decrypting dashboard · loading secure view';
                }
                
                // When iframe starts loading, we could update loader text, but fine.
                // Fade out entrance overlay with class transition
                entranceDiv.classList.add('hidden-overlay');
                
                // After entrance overlay is hidden (transition), we show dashboard container with fade in
                // Ensure dashboard becomes visible with opacity transition
                // But need to set dashboard opacity to 1 slightly after entrance start to avoid flicker.
                // We will set it after 80ms to let entrance visibility hide but smoothness.
                setTimeout(() => {
                    // Make dashboard container fully opaque
                    dashboardContainer.style.opacity = '1';
                    // Also update loader text once iframe loads, else keep subtle.
                }, 100);
                
                // When iframe finishes loading, update loader hint to success style
                iframeElem.addEventListener('load', function onLoad() {
                    if (loaderHint) {
                        loaderHint.textContent = '✓ dashboard active · live session';
                        loaderHint.style.borderLeftColor = '#22c55e';
                        loaderHint.style.backgroundColor = '#0f172ad9';
                        setTimeout(() => {
                            if (loaderHint) loaderHint.style.opacity = '0.6';
                        }, 2500);
                    }
                    // remove listener after first load
                    iframeElem.removeEventListener('load', onLoad);
                });
                
                // In case of iframe error (CORS or network) we could show fallback but target is public.
                iframeElem.addEventListener('error', function() {
                    if (loaderHint) {
                        loaderHint.textContent = '⚠️ connection warning · retrying';
                        loaderHint.style.borderLeftColor = '#f97316';
                    }
                });
            }
            
            // --- ENTER BUTTON triggers the site change ---
            const enterBtn = document.getElementById('enterButton');
            if (enterBtn) {
                enterBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    activateDashboard();
                });
            }
            
            // optional: support pressing "Enter" key while on entrance screen (accessibility)
            window.addEventListener('keydown', (e) => {
                if (!transitionStarted && entranceDiv && !entranceDiv.classList.contains('hidden-overlay')) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        activateDashboard();
                    }
                }
            });
            
            // small extra: clean up any remnants, and if someone clicks on overlay background (not the card) we don't trigger.
            // but only button / enter key will activate. also prevents accidental double trigger
            // Edge case: after transition, ensure iframe doesn't reload unintentionally
            // Provide a backup: if somehow the iframe fails to load due to restrictive headers, but page is embeddable.
            // since target is vercel app and allows framing (X-Frame-Options not set generally) we are safe.
            
            // Preload slight prefetch? not needed, but we add a small preconnect hint to improve perceived speed
            const preconnectLink = document.createElement('link');
            preconnectLink.rel = 'preconnect';
            preconnectLink.href = 'https://poopoopoooadmin.vercel.app';
            document.head.appendChild(preconnectLink);
            
            // Also if user revisits? no problem
            // add bonus smooth cursor effect
            console.log('✨ entrance ready — click "ENTER SITE" to load admin dashboard');
        })();
    </script>
    
    <!-- additional fallback styles for iframe sizing -->
    <style>
        /* ensure dashboard container covers entire viewport without scroll on body */
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .dashboard-container {
            transition: opacity 0.85s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            background: #010409;
        }
        iframe {
            background: #ffffff;
        }
        /* entrance overlay higher z-index */
        .entrance-overlay {
            z-index: 9999;
        }
    </style>
</body>
</html>
